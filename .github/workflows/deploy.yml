name: Deploy 360 CE Ops

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/360ce-ops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          OPS_SESSION_SECRET: test-secret
          OPS_AUTH_TOKEN: test-token
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH-deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/360ce-ops

            # The clone authenticates over HTTPS and these repos are private, so
            # a clone that has lost its credential dies on `could not read
            # Username for https://github.com` — non-interactive, no prompt, and
            # `set -e` then skips the image pull entirely. That is what stopped
            # runs 206 and 207 from reaching the box while their images built and
            # pushed perfectly: the merge landed, CI was green, and production
            # kept serving the previous image.
            #
            # 360-v2's deploy has carried the repair since it went private and
            # this one never got it. Guarded, so an absent secret leaves today's
            # behaviour exactly as it is rather than rewriting the remote to a
            # URL with an empty token in it.
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/mkmk749278/360ce-ops.git
            fi

            # A failure here names its own remedy. `could not read Username` is
            # the symptom of a missing credential and reads like a network
            # fault, and the deploy that follows it is silently skipped.
            if ! git pull --ff-only origin main; then
              echo "::error::The VPS clone at /opt/360ce-ops cannot authenticate to GitHub."
              echo "::error::Add GH_PAT to this repository's Actions secrets (the same value 360-v2 already holds),"
              echo "::error::or on the box: cd /opt/360ce-ops && git remote set-url origin <an authenticated URL>."
              echo "::error::Until then every merge builds an image that never reaches production."
              exit 1
            fi
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
