name: Deploy 360 CE Ops

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/360ce-ops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          OPS_SESSION_SECRET: test-secret
          OPS_AUTH_TOKEN: test-token
        run: pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH-deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/360ce-ops

            # The clone pulls over HTTPS with no credential, and GitHub has
            # begun refusing it. Two different refusals, one week apart, both
            # ending the deploy the same way — `set -e` skips the image pull
            # entirely, so the merge lands, CI is green, and production keeps
            # serving the previous image:
            #
            #   fatal: could not read Username for 'https://github.com'
            #   fatal: remote error: GitHub is temporarily limiting some
            #          unauthenticated downloads … Please retry later or
            #          authenticate.
            #
            # The second is the one run 208 hit, and it is worth reading
            # carefully: it is a THROTTLE on anonymous access, not a permission
            # error, so nothing about this repository changed — the pull was
            # working unauthenticated until GitHub decided it would rather it
            # were not. Which is why this deploy ran green for months and then
            # stopped for three runs in a row with no diff to blame.
            #
            # Either way the vendor's own instruction is the fix: authenticate.
            # 360-v2's deploy has authenticated its pull for months and this one
            # never did. Guarded, so an absent secret leaves today's behaviour
            # exactly as it is rather than rewriting the remote to a URL with an
            # empty token in it.
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/mkmk749278/360ce-ops.git
            fi

            # A failure here names its own remedy. Both of git's messages read
            # like something other than what they are — one like a broken
            # terminal, one like a transient network hiccup worth waiting out —
            # and the deploy that follows either is silently skipped.
            if ! git pull --ff-only origin main; then
              echo "::error::The VPS clone at /opt/360ce-ops cannot authenticate to GitHub."
              echo "::error::Add GH_PAT to this repository's Actions secrets (the same value 360-v2 already holds),"
              echo "::error::or on the box: cd /opt/360ce-ops && git remote set-url origin <an authenticated URL>."
              echo "::error::Until then every merge builds an image that never reaches production."
              exit 1
            fi
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
