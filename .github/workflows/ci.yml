name: CI

# Gates every PR into main (and every push to a non-main branch) BEFORE it can
# merge. Without this the only test run was deploy.yml's, which fires on
# push-to-main — i.e. after the change already reached the live control plane.
# A syntax error or broken template would auto-deploy in ~60s and take down the
# owner's kill-switch / auto-mode surface. This makes "green" a precondition of
# merge, not a post-deploy discovery.
on:
  pull_request:
    branches: [main]
  # No `push` trigger (2026-09-26): with both, every commit on a PR branch ran
  # the whole suite TWICE (measured: every PR commit in the last 40 runs has a
  # push run and a pull_request run on the same SHA). main's gate lives in
  # deploy.yml (pre-build test step).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    # Measured 2026-09-03, four runs: 6m52s, 8m40s, 9m28s, and one CANCELLED at
    # 10m15s. Most of that was NOT page rendering: it was ~1,600 real HTTP
    # calls per run to the production engine, GitHub and Binance, each waiting
    # on the network. The suite is hermetic since 2026-09-26 (tests/conftest.py)
    # and ran in 1m47s locally without coverage afterwards; re-derive the CI
    # figure rather than trust this comment:
    #   gh run list --workflow=ci.yml --json startedAt,updatedAt,conclusion
    # Kept at 20 until a few hermetic runs have been measured. Per-test hangs
    # are bounded separately by pytest-timeout (pyproject.toml).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt pytest-cov

      - name: Byte-compile (syntax check, whole app)
        run: python -m compileall -q app

      # Coverage is measured and REPORTED, not gated (2026-07-17): the
      # per-module table in the job summary keeps untested modules visible
      # at review time without turning a coverage dip into a red build.
      - name: Run tests
        env:
          OPS_SESSION_SECRET: test-secret
          OPS_AUTH_TOKEN: test-token
        run: pytest -q --cov=app --cov-report=term

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo '## Test coverage' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --sort=cover --skip-covered >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
