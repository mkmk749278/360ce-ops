services:
  ops:
    image: ghcr.io/mkmk749278/360ce-ops:latest
    build: .
    container_name: 360ce-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    environment:
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET}
      OPS_AUTH_TOKEN: ${OPS_AUTH_TOKEN}
      ENGINE_API_BASE: ${ENGINE_API_BASE:-https://api.luminapp.org}
      ENGINE_DATA_DIR: /engine-data
      MONITOR_LOGS_BASE_URL: ${MONITOR_LOGS_BASE_URL:-https://raw.githubusercontent.com/mkmk749278/360-v2/monitor-logs}
      MONITOR_LOGS_TTL_SEC: "60"
      ENGINE_CONTAINER_NAME: ${ENGINE_CONTAINER_NAME:-engine}
      DIAG_TIMEOUT_SEC: "30"
      # Control-plane audit log. Lives on the persistent `ops-data` volume
      # below — NOT the read-only /engine-data mount — so the record of
      # every owner control action survives the ~60s main-push redeploy.
      OPS_AUDIT_LOG: ${OPS_AUDIT_LOG:-/data/ops_audit.jsonl}
      # App-token + FCM device-token stores (Phase 1/4). On the persistent
      # `ops-data` volume so logins and push registrations survive redeploys.
      # The device registry path is SHARED with the monitoring-agent below,
      # which reads it to send push — both mount `ops-data` at /data.
      OPS_APP_TOKENS_PATH: ${OPS_APP_TOKENS_PATH:-/data/ops_app_tokens.json}
      OPS_DEVICE_TOKENS_PATH: ${OPS_DEVICE_TOKENS_PATH:-/data/ops_device_tokens.json}
      # Read-only access to the monitoring agent's alert state so the
      # dashboard's /alerts panel can surface live safety findings.
      AGENT_REDIS_URL: ${AGENT_REDIS_URL:-redis://360ce-ops-redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Mount the engine's named Docker volume read-only. The engine's
      # docker-compose creates `360-v2_360scalp-v2-data` (project-prefixed);
      # override via ENGINE_DATA_VOLUME if the engine project name changes.
      - engine-data:/engine-data:ro
      # Writable volume for the control-plane audit log (persists across
      # redeploys). Owner-only, never mounted into the engine.
      - ops-data:/data
      # Docker socket so the diag runner can `docker exec engine ...`.
      # Owner-only access trust assumption per CLAUDE.md.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      # Shared Redis holds the agent's alert state, read by /alerts.
      - 360ce-ops-redis

  monitoring-agent:
    image: ghcr.io/mkmk749278/360ce-ops:latest
    build: .
    container_name: 360ce-ops-agent
    restart: unless-stopped
    command: python -m app.agent.runner
    environment:
      OPS_SESSION_SECRET: ${OPS_SESSION_SECRET}
      OPS_AUTH_TOKEN: ${OPS_AUTH_TOKEN}
      ENGINE_API_BASE: ${ENGINE_API_BASE:-https://api.luminapp.org}
      ENGINE_DATA_DIR: /engine-data
      ENGINE_CONTAINER_NAME: ${ENGINE_CONTAINER_NAME:-engine}
      AGENT_TELEGRAM_BOT_TOKEN: ${AGENT_TELEGRAM_BOT_TOKEN}
      AGENT_TELEGRAM_CHAT_ID: ${AGENT_TELEGRAM_CHAT_ID}
      AGENT_REDIS_URL: ${AGENT_REDIS_URL:-redis://360ce-ops-redis:6379/0}
      AGENT_HEALTHCHECKS_URL: ${AGENT_HEALTHCHECKS_URL:-}
      AGENT_POLL_INTERVAL_S: ${AGENT_POLL_INTERVAL_S:-60}
      AGENT_NAKED_POSITION_GRACE_SEC: ${AGENT_NAKED_POSITION_GRACE_SEC:-90}
      AGENT_REDIS_STALE_SEC: ${AGENT_REDIS_STALE_SEC:-45}
      AGENT_DEDUP_SEC: ${AGENT_DEDUP_SEC:-1800}
      AGENT_ALERT_EXPIRY_SEC: ${AGENT_ALERT_EXPIRY_SEC:-3600}
      # FCM push (Phase 4). The agent sends alerts to every device the web
      # service registered — it reads the SAME device registry on the shared
      # `ops-data` volume, and sends via this service account. Empty = push
      # off (Telegram-only), unchanged behaviour.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      OPS_DEVICE_TOKENS_PATH: ${OPS_DEVICE_TOKENS_PATH:-/data/ops_device_tokens.json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - engine-data:/engine-data:ro
      # Shared with the `ops` service so the agent can read the FCM device
      # tokens the web app registers. Same named volume, same /data path.
      - ops-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # The image's own HEALTHCHECK fetches http://localhost:8000/healthz, which
    # is right for the `ops` web service and impossible here: this service
    # overrides the command to `python -m app.agent.runner` and serves no HTTP.
    # So the agent reported UNHEALTHY by construction — `failing streak 14`
    # eight minutes after a deploy on 2026-08-18, with a urllib connection
    # traceback as its last output — and nothing restarted, because this
    # container is not autoheal-labelled.
    #
    # That is worse than a false alarm. A health signal that can never be true
    # is a dead instrument: red on it means nothing, so red on it gets ignored,
    # on the one container whose failure is otherwise silent. It sat in
    # `docker ps` unread until /system rendered the healthcheck's own output.
    #
    # Replaced with the agent's real liveness — the heartbeat it stamps after
    # every cycle. start_period covers the first poll interval, so a fresh
    # container is `starting` rather than failing while it waits for its first
    # cycle to complete.
    healthcheck:
      test: ["CMD", "python", "-m", "app.agent.healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 150s
      retries: 3
    depends_on:
      - 360ce-ops-redis

  360ce-ops-redis:
    image: redis:7-alpine
    container_name: 360ce-ops-redis
    restart: unless-stopped
    # Ephemeral alert state — no persistence needed. 32 MB cap with LRU
    # eviction covers O(10) alert keys with 1h TTL with room to spare.
    command: redis-server --save "" --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru

volumes:
  engine-data:
    name: ${ENGINE_DATA_VOLUME:-360-v2_360scalp-v2-data}
    external: true
  # Persistent, ops-owned writable volume for the control-plane audit log.
  ops-data:
    name: ${OPS_DATA_VOLUME:-360ce-ops-data}
